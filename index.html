<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magas Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background: radial-gradient(circle at center, #13326d 0%, #0a1329 100%);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 40px;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            position: relative;
            height: 60px;
        }
        .btn-all-games {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .logo-container {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #00d2ff;
        }
        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 16px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 16px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .card-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 12px;
            border: 2px solid #00a2ff;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-info {
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 14px;
            line-height: 1.4;
        }
        .btn-select {
            background: #0076ff;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 10px 0;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 118, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-all-games">🎮 Все игры</button>
        <div class="logo-container">
            <img src="https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546395289.jpg" alt="Кемпачи" class="logo-img">
        </div>
        <div></div>
    </div>

    <div class="grid-container" id="products-grid"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const packages = [
            { diamonds: 105, price: 90, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 326, price: 250, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 431, price: 320, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 546, price: 450, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 1113, price: 830, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 1439, price: 1170, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 1659, price: 1250, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 2398, price: 10800, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 6160, price: 5100, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 12320, price: 8050, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: 18480, price: 13499, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: "Еженедельный lite", price: 79, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: "Месячный ваучер", price: 949, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: "Недельный ваучер", price: 250, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" },
            { diamonds: "Пропуск прокачки", price: 320, img: "https://github.com/freegudvrbg-collab/KenpachiShop/blob/a532c2bbbb9dd602f9a55b8ec701efacf23c7806/1780546284517.jpg" }
        ];

        const grid = document.getElementById('products-grid');

        packages.forEach(pkg => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let titleText = typeof pkg.diamonds === 'number' ? pkg.diamonds + ' Алмазов' : pkg.diamonds;

            card.innerHTML = `
                <div class="card-avatar">
                    <img src="${pkg.img}" alt="${titleText}" class="card-img">
                </div>
                <div class="card-info">${titleText} - ${pkg.price} ₽</div>
                <button class="btn-select" onclick="selectPackage('${pkg.diamonds}', ${pkg.price})">Выбрать</button>
            `;
            grid.appendChild(card);
        });

        function selectPackage(diamonds, price) {
            const data = {
                action: "select_package",
                diamonds: diamonds,
                price: price
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
